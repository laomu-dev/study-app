
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: study-app-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: study_app
      MYSQL_USER: studyapp
      MYSQL_PASSWORD: studyapppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - study-app-network

  app:
    build: .
    container_name: study-app
    ports:
      - "3001:3001"
    depends_on:
      - mysql
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: studyapp
      DB_PASSWORD: studyapppassword
      DB_NAME: study_app
      SESSION_SECRET: your-super-secret-key-here-change-this
    volumes:
      - ./uploads:/app/uploads
    networks:
      - study-app-network

  nginx:
    image: nginx:alpine
    container_name: study-app-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    networks:
      - study-app-network

volumes:
  mysql-data:

networks:
  study-app-network:
    driver: bridge
